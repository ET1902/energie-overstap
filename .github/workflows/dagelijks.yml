name: Dagelijkse energiecheck

on:
  schedule:
    - cron: '23 4 * * *'   # elke dag rond 05:23 (winter) / 06:23 (zomer) Nederlandse tijd
  workflow_dispatch:        # handmatig starten via 'Run workflow' (of de knop in de app)
    inputs:
      testmelding:
        description: 'Stuur een testmelding naar je telefoon'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: energiecheck
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Rekenmodel testen
        run: node --test test/*.test.mjs

      - name: Beursprijzen ophalen
        id: prijzen
        # Een storing bij een prijsbron mag de meldingen niet blokkeren; de app toont dan de laatste prijzen met datum.
        continue-on-error: true
        run: node scripts/haal-prijzen.mjs

      - name: Prijzen opslaan in de repository
        if: steps.prijzen.outcome == 'success'
        run: |
          git config user.name "energie-bot"
          git config user.email "energie-bot@users.noreply.github.com"
          git add data/prijzen.json
          if git diff --cached --quiet; then echo "Geen wijzigingen"; exit 0; fi
          git commit -m "Beursprijzen bijgewerkt $(date -u +%F)"
          # Haal eerst eventuele eigen wijzigingen (bijv. een upload tijdens deze run) op, dan pas pushen.
          for poging in 1 2 3; do
            git pull --rebase --quiet origin "${GITHUB_REF_NAME}" && git push --quiet && exit 0
            echo "Push mislukt (poging $poging), opnieuw proberen..."; sleep 5
          done
          exit 1

      - name: Vorige meldingen terughalen
        uses: actions/cache/restore@v5
        with:
          path: .staat
          key: staat-${{ github.run_id }}
          restore-keys: staat-

      - name: Persoonlijke check en melding
        if: always()
        env:
          PROFIEL_JSON: ${{ secrets.PROFIEL_JSON }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          MELDING_EMAIL: ${{ secrets.MELDING_EMAIL }}
          TESTMELDING: ${{ inputs.testmelding }}
          APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          mkdir -p .staat
          node scripts/controleer.mjs

      - name: Meldingen onthouden
        if: always()
        uses: actions/cache/save@v5
        with:
          path: .staat
          key: staat-${{ github.run_id }}
